<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071C26"/>
      <stop offset="50%" stop-color="#0E3F52"/>
      <stop offset="100%" stop-color="#0B2533"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6ECD8"/>
      <stop offset="40%" stop-color="#D4A247"/>
      <stop offset="100%" stop-color="#A8791E"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#146A80"/>
      <stop offset="100%" stop-color="#49A6BC"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="3"/>

  <!-- Subtle grid lines for global trade navigation -->
  <circle cx="64" cy="64" r="42" fill="none" stroke="#FAF8F3" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="64" cy="64" r="24" fill="none" stroke="#FAF8F3" stroke-opacity="0.1" stroke-width="1"/>
  
  <!-- Dynamic stylized X trade compass arrows -->
  <!-- Left to Right upward slash -->
  <path d="M34 94 L84 34" stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Right to Left downward slash with gap for depth -->
  <path d="M94 94 L72 68" stroke="url(#tealGrad)" stroke-width="12" stroke-linecap="round"/>
  <path d="M56 48 L34 34" stroke="url(#tealGrad)" stroke-width="12" stroke-linecap="round"/>

  <!-- Compass Arrow head accents -->
  <polygon points="84,26 94,36 78,38" fill="url(#goldGrad)"/>
  <polygon points="34,102 24,92 40,90" fill="url(#tealGrad)"/>

  <!-- Golden Center Pivot Point -->
  <circle cx="64" cy="64" r="5.5" fill="#FAF8F3" stroke="#A8791E" stroke-width="2"/>
</svg>
